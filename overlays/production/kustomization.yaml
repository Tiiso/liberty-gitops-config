apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liberty-demo-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: production

images:
  - name: image-registry.openshift-image-registry.svc:5000/liberty-demo-prod/liberty-app
    newTag: main

patches:
  - path: deployment-patch.yaml
    target:
      kind: Rollout
      name: liberty-app
